unit = "mla_front.q_b_gemv"
phase = 1
symbol = "glm52_fp8_weight_only_gemv_batched_cuda"
adapter = "mla_front_q_b_gemv"
capability = { blackwell_only = true }
[axes]
rows = [1, 2, 4, 8, 16, 32, 64]
[shape]
n = 16384
k = 2048
[contract]
inputs = "act[bs,k] bf16; weight[n,k] e4m3; scales[ceil(n/128), k/128] f32 (checkpoint weight_scale_inv raw bytes)"
outputs = "out[bs,n] bf16"
accumulation = "f32"
notes = "rows=1 CUDA-core GEMV; rows=2 register tile bit-parity; rows=4/8 tensor-core mma（需要 f32 scratch partials，大小规则见 csrc/glm52/glm52_moe_gemv.cu），bucket 间非 bit-identical。rows 1–8 = decode bucket；16–64 = MTP span-mapped verify 行 / 未来大 batch（multi-subtile mma，BTILES=rows/8，Blackwell-only 实测表 {16:8,2; 32:4,4; 64:2,2}，GB300 kernel_lab 2026-07-29）。该路径由 KERNEL_LAB_GEMV_MMA_MULTI 门控：harness 默认置 1（loader.py），生产侧 16/32/48 仍走 #812 register tile（48 未扫，等待 A/B 后再切换）"
[reference]
mode = "torch_tolerance"
[reference.tolerance]
rel_l2 = 0.02
note = "bf16 store floor（2^-8 相对量级）；首次 GB300 实测后在此补 measured 值与机器"
