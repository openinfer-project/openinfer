unit = "norm.rms_norm"
phase = 1
symbol = "rms_norm_batched_cuda"
adapter = "norm_rms_norm"
capability = { blackwell_only = true }
[axes]
rows = [1, 2, 4, 8, 16, 32, 64]
[shape]
n = 6144
k = 6144
eps = 1e-5
[contract]
inputs = "x[rows,6144] bf16; weight[6144] bf16（input_layernorm gamma，生产分布 ~1+0.1N(0,1)）"
outputs = "out[rows,6144] bf16"
accumulation = "f32 行内归约（grid=rows，一 CTA 一行，行间互不依赖）"
notes = "standalone RMSNorm：layer-0 input norm（step_body.rs:76——embedding 即残差，无法融合）；同一内核同 dim 也服务 final norm（bookend.rs:47）与 MTP enorm/hnorm/shared_norm（mtp.rs:195/:204/:263）。内核=FlashInfer norm::RMSNorm 模板（flashinfer_norm.cu:204），FFI 为 void 返回（无 CUresult，launch 错误只表现为流上的 sticky error，与生产 ops/norm.rs 一致）。rows>8：一 CTA 一行、行归约自包含，任意 rows 每行与 rows=1 逐位一致，无 .cu 改动。manifest [shape] n=k=hidden 只是 GEMV 词汇的 schema 映射——derive_shapes 的 weight_bytes/scale_len/scratch_rule 对本单元无语义；真实缓冲：x/out 各 rows*6144*2 B，weight 12288 B，无 scale/scratch。"
[reference]
mode = "torch_tolerance"
[reference.tolerance]
rel_l2 = 0.02
note = "bf16 store floor：RN 半 ulp 相对误差 ≤2^-8/元素，张量级 rel_l2 典型 ~1e-3（2^-9/√3 量级）；rms 标量的 f32 归约序差（torch 参考不复现）远低于该 floor。0.02 ≈ 4×2^-8 余量。UNMEASURED，GB300 首测后回填实测值与机器。"
