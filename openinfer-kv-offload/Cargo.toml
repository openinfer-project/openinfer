[package]
edition = "2024"
license = "Apache-2.0"
name = "openinfer-kv-offload"
version = "0.1.0"

[dependencies]
# The client shares PegaFlow's wire-compatible error/save types but does not
# embed its storage engine or RDMA stack. Pinned to the native-arena server:
# registration returns a CUDA IPC handle for the server-allocated KV arena.
pegaflow-core = { git = "https://github.com/novitalabs/pegaflow.git", rev = "641a4023e9b0c72ce3ecb3a5f60230b7333578e3", default-features = false }
pegaflow-proto = { git = "https://github.com/novitalabs/pegaflow.git", rev = "641a4023e9b0c72ce3ecb3a5f60230b7333578e3" }
cudarc = { workspace = true }
half = { workspace = true }
log = { workspace = true }
openinfer-kv-cache = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
uuid = { workspace = true }
xxhash-rust = { workspace = true }

[dev-dependencies]
openinfer-kernels = { workspace = true }

[lints]
workspace = true
