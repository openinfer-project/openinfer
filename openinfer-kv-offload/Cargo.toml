[package]
edition = "2024"
license = "Apache-2.0"
name = "openinfer-kv-offload"
version = "0.1.0"

[dependencies]
# The client shares PegaFlow's wire-compatible error/save types but does not
# embed its storage engine or RDMA stack. Pinned to the native-arena server:
# registration returns a CUDA IPC handle for the server-allocated KV arena.
pegaflow-core = { git = "https://github.com/novitalabs/pegaflow.git", rev = "6043c290000a1cc5a384cff59bda6ecaaf868027", default-features = false }
pegaflow-proto = { git = "https://github.com/novitalabs/pegaflow.git", rev = "6043c290000a1cc5a384cff59bda6ecaaf868027" }
cudarc = { workspace = true }
half = { workspace = true }
log = { workspace = true }
openinfer-kv-cache = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
uuid = { workspace = true }
xxhash-rust = { workspace = true }

[dev-dependencies]
openinfer-kernels = { workspace = true }

[lints]
workspace = true
