unit = "fp8_gemm_dsl_tc.shared_down"
# Phase 3: CuTe DSL tcgen05 hand-written fp8 groupwise GEMM (compared against fp8_gemm.shared_down).
phase = 3
symbol = "cutedsl_fp8_blockwise_gemm_tcgen05"
adapter = "fp8_gemm_dsl_tc"
capability = { python_native = true, sm_tcgen05_only = true }
scratch = "none — TILE_CFG split_k=1 for this shape; the kernel writes bf16 out directly with no partial buffer"
[axes]
rows = [4, 8, 16, 32, 48, 64]
[shape]
n = 6144
k = 2048
[contract]
inputs = "Fully same-source as fp8_gemm.shared_down (make_inputs delegates to fp8_gemm_groupwise): act e4m3 [rows, 2048] + act_scales f32 [rows, 16]; weight e4m3 [6144, 2048] + weight_scales f32 [48, 16] (the 32 MiB workspace is generated but unused by the DSL kernel)"
outputs = "out[rows, 6144] bf16"
accumulation = "f32 (tcgen05.mma e4m3; TMEM block accumulator is folded per 128-K block into the f32 register total acc by SFA x SFB — algorithmically the same software blockscale as the CUTLASS blockwise mainloop)"
notes = "CuTe DSL 4.6.0 JIT (cute.compile cached per (rows,n,k)); tile 64x128x128 (K tile = one scale block), 160 threads (4 acc/epilogue warps + 1 TMA/MMA warp), double-buffered TMEM acc, AB smem stages auto-sized to capacity (~9). grid is a single M-tile over N; rows<64 handled by TMA zero-fill + row-predicated stores."
[reference]
mode = "torch_tolerance"
[reference.tolerance]
rel_l2 = 0.02
note = "Same reference as fp8_gemm.* (refs/fp8_gemm.groupwise_gemm_ref: dual dequant f32 matmul + bf16 store)"
